version: '3'

tasks:
  build:
    desc: Generate dist/ from tokens/family.json
    cmds:
      - node scripts/build.mjs

  check:
    desc: The gate. dist/ must be exactly what the source generates.
    cmds:
      - node scripts/build.mjs
      - git diff --exit-code -- dist/
      - node scripts/check-cards.mjs

  status:
    desc: Which ragtime-design version each consumer has vendored (reads GitHub, needs gh)
    cmds:
      - node scripts/status.mjs

  release:
    desc: Tag the version on main once its check passed, then open a bump PR in each consumer that is behind (-- --dry-run, -- --only Name,Name)
    cmds:
      - node scripts/release.mjs {{.CLI_ARGS}}
